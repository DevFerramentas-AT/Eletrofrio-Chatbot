<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary:       #18ade8;
  --primary-dark:  #0e8abf;
  --primary-light: rgba(24,173,232,0.12);
  --primary-glow:  rgba(24,173,232,0.25);
  --bg:            #0d0d10;
  --bg2:           #141418;
  --bg3:           #1c1c22;
  --bg4:           #242430;
  --border:        rgba(255,255,255,0.07);
  --border-hi:     rgba(255,255,255,0.14);
  --text:          #eeeef0;
  --text2:         #888894;
  --text3:         #4a4a58;
  --radius:        18px;
  --radius-sm:     10px;
  --radius-xs:     6px;
  --shadow:        0 8px 32px rgba(0,0,0,0.5);
  --shadow-sm:     0 2px 12px rgba(0,0,0,0.3);
  --font:          'Plus Jakarta Sans', system-ui, sans-serif;
}

html, body {
  height: 100%; width: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── Config overlay ── */
#config-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
#config-overlay.hidden { display: none; }

.config-card {
  background: var(--bg2);
  border: 1px solid var(--border-hi);
  border-radius: 24px;
  padding: 36px 40px;
  width: 100%; max-width: 480px;
  box-shadow: var(--shadow);
}
.config-logo {
  font-size: 28px; font-weight: 700; letter-spacing: -.03em;
  color: var(--text); margin-bottom: 6px;
}
.config-logo span { color: var(--primary); }
.config-subtitle {
  font-size: 13px; color: var(--text2); margin-bottom: 32px;
}
.config-field { margin-bottom: 18px; }
.config-field label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 7px;
}
.config-field input {
  width: 100%; background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text); font-size: 13.5px;
  padding: 10px 14px; outline: none;
  font-family: var(--font); transition: border-color .15s;
}
.config-field input:focus { border-color: var(--primary); }
.config-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.config-color-wrap {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 14px;
  transition: border-color .15s; cursor: pointer;
}
.config-color-wrap:focus-within { border-color: var(--primary); }
.config-color-wrap input[type="color"] {
  width: 28px; height: 28px; border: none; padding: 0;
  background: none; cursor: pointer; border-radius: 6px; flex-shrink: 0;
}
.config-color-label { font-size: 13px; color: var(--text2); }
.btn-start {
  width: 100%; padding: 13px;
  background: var(--primary); border: none;
  border-radius: var(--radius-sm); color: #fff;
  font-size: 14px; font-weight: 600;
  font-family: var(--font); cursor: pointer;
  transition: background .15s, transform .1s;
  margin-top: 8px;
}
.btn-start:hover { background: var(--primary-dark); }
.btn-start:active { transform: scale(.98); }
.config-error {
  font-size: 12px; color: #f06060; margin-top: 8px;
  display: none; padding: 8px 12px;
  background: rgba(240,96,96,0.08);
  border-radius: var(--radius-xs); border: 1px solid rgba(240,96,96,0.2);
}
.config-error.show { display: block; }

/* ── Main layout ── */
#app {
  display: flex; flex-direction: column;
  height: 100vh; width: 100%;
  opacity: 0; transition: opacity .4s ease;
}
#app.visible { opacity: 1; }

/* ── Header ── */
#chat-header {
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px; height: 64px; flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: relative;
}
.header-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  flex-shrink: 0; object-fit: cover;
  border: 2px solid var(--primary);
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; overflow: hidden;
}
.header-avatar img { width: 100%; height: 100%; object-fit: cover; }
.header-info { flex: 1; min-width: 0; }
.header-name {
  font-size: 15px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-status {
  font-size: 12px; color: var(--text2);
  display: flex; align-items: center; gap: 5px; margin-top: 1px;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #3ecf8e; flex-shrink: 0;
  animation: pulse-dot 2.5s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}
.header-actions { display: flex; gap: 8px; }
.header-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: transparent; border: 1px solid var(--border);
  color: var(--text2); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.header-btn:hover { background: var(--bg3); border-color: var(--border-hi); color: var(--text); }

/* ── Messages area ── */
#messages {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 24px 20px;
  display: flex; flex-direction: column; gap: 6px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* date divider */
.msg-date-divider {
  align-self: center; font-size: 11px; color: var(--text3);
  padding: 3px 12px; background: var(--bg3);
  border-radius: 20px; margin: 8px 0; border: 1px solid var(--border);
}

/* ── Bubble base ── */
.bubble-row {
  display: flex; align-items: flex-end; gap: 8px;
  animation: bubble-in .22s cubic-bezier(.34,1.56,.64,1) both;
}
.bubble-row.user { flex-direction: row-reverse; }

@keyframes bubble-in {
  from { opacity: 0; transform: translateY(10px) scale(.96); }
  to   { opacity: 1; transform: none; }
}

.bubble-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg3); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; overflow: hidden; border: 1px solid var(--border);
  margin-bottom: 2px;
}
.bubble-avatar img { width: 100%; height: 100%; object-fit: cover; }
.bubble-avatar.ghost { visibility: hidden; }

.bubble {
  max-width: min(72%, 520px);
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px; line-height: 1.6;
  word-break: break-word;
}
.bubble-row.bot .bubble {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.bubble-row.user .bubble {
  background: var(--primary);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.bubble-time {
  font-size: 10px; color: var(--text3);
  margin-top: 4px; padding: 0 4px;
  white-space: nowrap; align-self: flex-end;
}
.bubble-row.user .bubble-time { text-align: right; }

/* typing indicator */
.typing-dots {
  display: flex; gap: 4px; padding: 4px 2px;
  align-items: center;
}
.typing-dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text3);
  animation: typing-bounce .9s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .15s; }
.typing-dots span:nth-child(3) { animation-delay: .30s; }
@keyframes typing-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .5; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ── Choice buttons ── */
.choices-wrap {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 4px 0 4px 38px;
  animation: bubble-in .25s ease both;
}
.choice-btn {
  padding: 9px 18px; border-radius: 24px;
  border: 1px solid; font-size: 13px; font-weight: 500;
  cursor: pointer; font-family: var(--font);
  transition: all .15s; white-space: nowrap;
}
.choice-btn:disabled { opacity: .4; cursor: default; }

/* ── Orientation gallery ── */
.orientation-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  max-width: min(72%, 520px);
  animation: bubble-in .22s ease both;
}
.orientation-msg {
  padding: 10px 14px 8px; font-size: 14px; line-height: 1.6;
  color: var(--text); border-bottom: 1px solid var(--border);
}
.orientation-img-wrap {
  position: relative; width: 100%;
  background: var(--bg4); min-height: 160px;
  display: flex; align-items: center; justify-content: center;
}
.orientation-img-wrap img {
  width: 100%; max-height: 280px; object-fit: cover; display: block;
}
.orientation-img-placeholder {
  font-size: 13px; color: var(--text3); padding: 40px;
}
.orientation-caption {
  padding: 8px 14px; font-size: 12px; color: var(--text2);
  background: var(--bg4); border-top: 1px solid var(--border);
  line-height: 1.5;
}
.orientation-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; gap: 8px;
}
.orientation-nav-btn {
  padding: 7px 18px; border-radius: 20px;
  font-size: 12px; font-weight: 500; cursor: pointer;
  font-family: var(--font); transition: all .15s;
}
.orientation-nav-btn:disabled { opacity: .3; cursor: default; }
.orientation-counter { font-size: 12px; color: var(--text2); }

/* ── Hub transition ── */
.hub-divider {
  align-self: center; display: flex; align-items: center; gap: 10px;
  font-size: 11px; font-weight: 600; letter-spacing: .05em;
  text-transform: uppercase; margin: 10px 0;
  animation: bubble-in .3s ease both;
}
.hub-divider::before, .hub-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.hub-divider span {
  padding: 3px 12px; border-radius: 20px;
  border: 1px solid; font-size: 11px;
}

/* ── Input area ── */
#input-area {
  padding: 14px 20px 18px; flex-shrink: 0;
  background: var(--bg2); border-top: 1px solid var(--border);
}
.input-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 28px; padding: 6px 6px 6px 18px;
  transition: border-color .2s;
}
.input-row:focus-within { border-color: var(--primary); }
#chat-input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-size: 14px; font-family: var(--font);
  padding: 6px 0;
}
#chat-input::placeholder { color: var(--text3); }
#chat-input:disabled { opacity: .4; }
#send-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--primary); border: none; color: #fff;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s; flex-shrink: 0;
}
#send-btn:hover { background: var(--primary-dark); }
#send-btn:active { transform: scale(.9); }
#send-btn:disabled { background: var(--bg4); color: var(--text3); cursor: default; transform: none; }

/* ── Restart banner ── */
#restart-bar {
  display: none; align-items: center; justify-content: center;
  gap: 10px; padding: 10px 20px;
  background: var(--bg3); border-top: 1px solid var(--border);
  font-size: 13px; color: var(--text2);
}
#restart-bar.show { display: flex; }
.btn-restart {
  padding: 6px 16px; border-radius: 20px;
  background: var(--primary-light); border: 1px solid var(--primary-glow);
  color: var(--primary); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: var(--font); transition: all .15s;
}
.btn-restart:hover { background: rgba(24,173,232,0.2); }

/* ── Loading screen ── */
#loading-screen {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
}
#loading-screen.hidden { display: none; }
.loading-spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text2); }

/* ── Scrollbar thin ── */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>
<body>

<!-- Config overlay -->
<div id="config-overlay">
  <div class="config-card">
    <div class="config-logo">Eletrofrio<span>Chat</span></div>
    <div class="config-subtitle">Configure a instância do bot antes de iniciar</div>

    <div class="config-field">
      <label>URL do JSON do bot</label>
      <input id="cfg-url" type="url" placeholder="https://exemplo.com/bot.json" />
    </div>

    <div class="config-row">
      <div class="config-field">
        <label>Nome do bot</label>
        <input id="cfg-name" type="text" placeholder="Assistente" value="Assistente" />
      </div>
      <div class="config-field">
        <label>URL do avatar</label>
        <input id="cfg-avatar" type="url" placeholder="https://…/avatar.png" />
      </div>
    </div>

    <div class="config-field">
      <label>Cor primária</label>
      <div class="config-color-wrap">
        <input type="color" id="cfg-color" value="#18ade8" />
        <span class="config-color-label" id="cfg-color-label">#18ade8</span>
      </div>
    </div>

    <div id="cfg-error" class="config-error">Não foi possível carregar o JSON. Verifique a URL e tente novamente.</div>

    <button class="btn-start" onclick="startBot()">Iniciar conversa →</button>
  </div>
</div>

<!-- Loading screen -->
<div id="loading-screen" class="hidden">
  <div class="loading-spinner"></div>
  <div class="loading-text">Carregando bot…</div>
</div>

<!-- Main app -->
<div id="app">
  <div id="chat-header">
    <div class="header-avatar" id="header-avatar">🤖</div>
    <div class="header-info">
      <div class="header-name" id="header-name">Assistente</div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span>Online agora</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" title="Reiniciar conversa" onclick="restartChat()">↺</button>
      <button class="header-btn" title="Configurações" onclick="openConfig()">⚙</button>
    </div>
  </div>

  <div id="messages"></div>

  <div id="restart-bar">
    <span>Conversa encerrada</span>
    <button class="btn-restart" onclick="restartChat()">↺ Reiniciar</button>
  </div>

  <div id="input-area">
    <div class="input-row">
      <input id="chat-input" placeholder="Digite sua mensagem…" disabled
        onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendInput(); }">
      <button id="send-btn" onclick="sendInput()" disabled>↑</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let nodes       = [];
let chatVars    = {};
let awaitingInput = false;
let currentNodeId = null;
let botName     = 'Assistente';
let botAvatar   = null;
let primaryColor = '#18ade8';
let timerTimeout = null;
let timerInterval = null;

// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
document.getElementById('cfg-color').addEventListener('input', e => {
  document.getElementById('cfg-color-label').textContent = e.target.value;
});

async function startBot() {
  const url    = document.getElementById('cfg-url').value.trim();
  const name   = document.getElementById('cfg-name').value.trim() || 'Assistente';
  const avatar = document.getElementById('cfg-avatar').value.trim();
  const color  = document.getElementById('cfg-color').value;
  const errEl  = document.getElementById('cfg-error');
  errEl.classList.remove('show');

  if (!url) { errEl.textContent = 'Informe a URL do JSON do bot.'; errEl.classList.add('show'); return; }

  // show loader
  document.getElementById('config-overlay').classList.add('hidden');
  document.getElementById('loading-screen').classList.remove('hidden');

  try {
    const res  = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    nodes = data.nodes || [];
    if (!nodes.length) throw new Error('Nenhum nó encontrado no JSON.');
  } catch(err) {
    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('config-overlay').classList.remove('hidden');
    errEl.textContent = 'Erro ao carregar: ' + err.message;
    errEl.classList.add('show');
    return;
  }

  // apply config
  botName      = name;
  botAvatar    = avatar;
  primaryColor = color;
  applyTheme();
  applyIdentity();

  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  startConversation();
}

function applyTheme() {
  const r = document.documentElement;
  // convert hex to rgb for rgba usage
  const hex = primaryColor.replace('#','');
  const rr = parseInt(hex.slice(0,2),16);
  const gg = parseInt(hex.slice(2,4),16);
  const bb = parseInt(hex.slice(4,6),16);
  r.style.setProperty('--primary',       primaryColor);
  r.style.setProperty('--primary-dark',  shadeColor(primaryColor, -20));
  r.style.setProperty('--primary-light', `rgba(${rr},${gg},${bb},0.12)`);
  r.style.setProperty('--primary-glow',  `rgba(${rr},${gg},${bb},0.28)`);
}

function applyIdentity() {
  document.getElementById('header-name').textContent = botName;
  document.title = botName;
  const av = document.getElementById('header-avatar');
  if (botAvatar) {
    av.innerHTML = `<img src="${botAvatar}" onerror="this.parentElement.textContent='🤖'">`;
  } else {
    av.textContent = '🤖';
  }
}

function shadeColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.min(255, Math.max(0, (num >> 16) + amt));
  const G = Math.min(255, Math.max(0, ((num >> 8) & 0xFF) + amt));
  const B = Math.min(255, Math.max(0, (num & 0xFF) + amt));
  return '#' + ((1<<24)|(R<<16)|(G<<8)|B).toString(16).slice(1);
}

function openConfig() {
  document.getElementById('config-overlay').classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════
// CHAT ENGINE
// ═══════════════════════════════════════════════════════════
function startConversation() {
  chatVars = {}; awaitingInput = false; currentNodeId = null;
  clearTimer();
  document.getElementById('messages').innerHTML = '';
  document.getElementById('chat-input').value = '';
  document.getElementById('chat-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('restart-bar').classList.remove('show');

  const start = findStartNode(nodes);
  if (start) setTimeout(() => runNode(start.id), 400);
  else addBotMsg('⚠ Nenhum bloco inicial encontrado.');
}

function restartChat() {
  startConversation();
}

function findStartNode(nodeList) {
  return nodeList.find(n => !nodeList.some(x =>
    x.next === n.id || (x.choices && x.choices.some(c => c.next === n.id))
  ));
}

async function runNode(id) {
  if (!id) return;
  const n = nodes.find(x => x.id === id);
  if (!n) return;
  currentNodeId = id;
  clearTimer();

  // ── end ──
  if (n.type === 'end') {
    if (n.content) addBotMsg(interpolate(n.content));
    document.getElementById('restart-bar').classList.add('show');
    return;
  }

  // ── setvar ──
  if (n.type === 'setvar') {
    (n.assignments || []).forEach(a => {
      if (a.variable) chatVars[a.variable] = interpolate(a.value || '');
    });
    if (n.next) setTimeout(() => runNode(n.next), 100);
    return;
  }

  // ── condition ──
  if (n.type === 'condition') {
    let matched = false;
    for (const rule of (n.rules || [])) {
      if (evalCondRule(rule, chatVars)) {
        (rule.actions || []).forEach(a => { if (a.variable) chatVars[a.variable] = interpolate(a.value || ''); });
        matched = true;
        if (rule.next) setTimeout(() => runNode(rule.next), 100);
        break;
      }
    }
    if (!matched) {
      (n.elseActions || []).forEach(a => { if (a.variable) chatVars[a.variable] = interpolate(a.value || ''); });
      if (n.elseNext) setTimeout(() => runNode(n.elseNext), 100);
    }
    return;
  }

  // ── query ──
  if (n.type === 'query') {
    const loadEl = addBotMsg(n.apiLoadingMsg || 'Consultando…', true);
    try {
      const rawUrl = interpolate(n.apiUrl || '');
      const method = n.apiMethod || 'GET';
      const headers = { 'Content-Type': 'application/json' };
      if (n.apiAuth) headers['Authorization'] = interpolate(n.apiAuth);
      const paramsObj = {};
      (n.apiParams || []).forEach(p => { if (p.key) paramsObj[p.key] = interpolate(p.value || ''); });
      let finalUrl = rawUrl, fetchOpts = { method, headers };
      if (method === 'GET' || method === 'DELETE') {
        const qs = Object.entries(paramsObj).map(([k,v]) => encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
        if (qs) finalUrl += (rawUrl.includes('?') ? '&' : '?') + qs;
      } else { fetchOpts.body = JSON.stringify(paramsObj); }
      const res = await fetch(finalUrl, fetchOpts);
      const data = await res.json();
      (n.apiMappings || []).forEach(m => {
        if (m.jsonKey && m.variable) {
          const val = getNestedValue(data, m.jsonKey);
          if (val !== undefined) chatVars[m.variable] = String(val);
        }
      });
      loadEl.remove();
    } catch {
      loadEl.remove();
      addBotMsg(n.apiErrorMsg || 'Não foi possível consultar. Tente novamente.');
    }
    if (n.next) setTimeout(() => runNode(n.next), 300);
    return;
  }

  // ── hub ──
  if (n.type === 'hub') {
    if (n.transitionMsg) {
      addHubDivider(n.transitionMsg);
    }
    // Hub: load target flow nodes from the JSON's meta or inline (for standalone player, we note only)
    addBotMsg(`🔗 Redirecionando para: ${n.targetFlow || '(não configurado)'}`);
    return;
  }

  // ── ai ──
  if (n.type === 'ai') {
    const loadEl = addBotMsg('', true); // typing
    const rawPrompt = (n.content || '').replace(/\{\{ia:\s*(.*?)\}\}/s, '$1');
    const reply = await callAI(interpolate(rawPrompt));
    loadEl.remove();
    addBotMsg(reply);
    if (n.next) setTimeout(() => runNode(n.next), 400);
    return;
  }

  // ── input ──
  if (n.type === 'input') {
    if (n.content) addBotMsg(interpolate(n.content));
    enableInput();
    if (n.timeoutSeconds > 0) startTimer(n.timeoutSeconds, n.timeoutMsg);
    return;
  }

  // ── choice ──
  if (n.type === 'choice') {
    if (n.content) addBotMsg(interpolate(n.content));
    showChoices(n);
    if (n.timeoutSeconds > 0) startTimer(n.timeoutSeconds, n.timeoutMsg);
    return;
  }

  // ── orientation ──
  if (n.type === 'orientation') {
    showOrientation(n);
    if (n.next) setTimeout(() => runNode(n.next), 500);
    return;
  }

  // ── message (default) ──
  addBotMsg(interpolate(n.content || ''));
  if (n.next) setTimeout(() => runNode(n.next), 500);
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
function enableInput() {
  awaitingInput = true;
  const inp = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  inp.disabled = false; btn.disabled = false;
  setTimeout(() => inp.focus(), 100);
}

function disableInput() {
  awaitingInput = false;
  document.getElementById('chat-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
}

function sendInput() {
  if (!awaitingInput) return;
  const inp = document.getElementById('chat-input');
  const val = inp.value.trim();
  if (!val) return;

  const n = nodes.find(x => x.id === currentNodeId);

  // validations
  if (n?.validations?.length) {
    for (const v of n.validations) {
      let ok = true;
      if (v.type === 'minLen')       ok = val.length >= (v.min || 1);
      else if (v.type === 'maxLen')  ok = val.length <= (v.max || 100);
      else if (v.type === 'onlyLetters') ok = /^[A-Za-zÀ-ÖØ-öø-ÿ\s]+$/.test(val);
      else if (v.type === 'onlyNumbers') ok = /^\d+$/.test(val);
      else if (v.type === 'onlyAlpha')   ok = /^[A-Za-zÀ-ÖØ-öø-ÿ0-9\s]+$/.test(val);
      else if (v.type === 'blockedChars') {
        const found = [...val].find(ch => (v.blocked||'').includes(ch));
        ok = !found;
      }
      else if (v.type === 'regex') {
        try { ok = new RegExp(v.pattern || '').test(val); } catch { ok = false; }
      }
      if (!ok) {
        addBotMsg('⚠ ' + (v.errorMsg || 'Entrada inválida. Tente novamente.'));
        inp.value = '';
        if (v.onFail) { disableInput(); setTimeout(() => runNode(v.onFail), 400); }
        return;
      }
    }
  }

  clearTimer();
  addUserMsg(val);
  inp.value = '';
  disableInput();
  if (n?.saveAs) chatVars[n.saveAs] = val;
  chatVars.lastInput = val;
  if (n?.next) setTimeout(() => runNode(n.next), 350);
}

// ═══════════════════════════════════════════════════════════
// CHOICES
// ═══════════════════════════════════════════════════════════
function showChoices(n) {
  const wrap = document.createElement('div');
  wrap.className = 'choices-wrap';
  (n.choices || []).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = interpolate(c.label) || '(opção)';
    btn.style.borderColor = primaryColor;
    btn.style.color = primaryColor;
    btn.style.background = `rgba(${hexToRgb(primaryColor)},0.08)`;
    btn.onmouseover = () => { btn.style.background = `rgba(${hexToRgb(primaryColor)},0.18)`; };
    btn.onmouseout  = () => { btn.style.background = `rgba(${hexToRgb(primaryColor)},0.08)`; };
    btn.onclick = () => {
      clearTimer();
      wrap.querySelectorAll('button').forEach(b => b.disabled = true);
      addUserMsg(btn.textContent);
      if (c.next) setTimeout(() => runNode(c.next), 350);
    };
    wrap.appendChild(btn);
  });
  appendToMessages(wrap);
}

// ═══════════════════════════════════════════════════════════
// ORIENTATION
// ═══════════════════════════════════════════════════════════
function showOrientation(n) {
  const imgs = n.images || [];
  if (n.content) addBotMsg(interpolate(n.content));
  if (!imgs.length) return;

  const card = document.createElement('div');
  card.className = 'orientation-card';
  card.style.marginLeft = '38px';

  let idx = 0;
  const renderCard = () => {
    const img = imgs[idx];
    card.innerHTML = `
      <div class="orientation-img-wrap">
        ${img.url
          ? `<img src="${img.url}" alt="${img.caption||''}" onerror="this.outerHTML='<div class=\\'orientation-img-placeholder\\'>🖼 Imagem não disponível</div>'">`
          : `<div class="orientation-img-placeholder">🖼 Sem imagem</div>`}
      </div>
      ${img.caption ? `<div class="orientation-caption">${img.caption}</div>` : ''}
      <div class="orientation-nav">
        <button class="orientation-nav-btn" id="ori-prev" style="border:1px solid var(--border);background:var(--bg4);color:var(--text2)" ${idx===0?'disabled':''}>◀ Anterior</button>
        <span class="orientation-counter">${idx+1} / ${imgs.length}</span>
        <button class="orientation-nav-btn" id="ori-next" style="border:1px solid ${primaryColor};background:rgba(${hexToRgb(primaryColor)},0.10);color:${primaryColor}" ${idx===imgs.length-1?'disabled':''}>Próximo ▶</button>
      </div>`;
    card.querySelector('#ori-prev').onclick = () => { if(idx>0){idx--;renderCard();} };
    card.querySelector('#ori-next').onclick = () => { if(idx<imgs.length-1){idx++;renderCard();} };
  };
  renderCard();
  appendToMessages(card);
}

// ═══════════════════════════════════════════════════════════
// MESSAGE RENDERING
// ═══════════════════════════════════════════════════════════
function addBotMsg(text, isTyping = false) {
  const row = document.createElement('div');
  row.className = 'bubble-row bot';

  const av = document.createElement('div');
  av.className = 'bubble-avatar';
  if (botAvatar) av.innerHTML = `<img src="${botAvatar}" onerror="this.parentElement.textContent='🤖'">`;
  else av.textContent = '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (isTyping) {
    bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
  } else {
    bubble.textContent = text;
  }

  const timeEl = document.createElement('div');
  timeEl.className = 'bubble-time';
  timeEl.textContent = nowTime();

  const col = document.createElement('div');
  col.style.display = 'flex'; col.style.flexDirection = 'column';
  col.appendChild(bubble);
  col.appendChild(timeEl);

  row.appendChild(av);
  row.appendChild(col);
  appendToMessages(row);
  return row;
}

function addUserMsg(text) {
  const row = document.createElement('div');
  row.className = 'bubble-row user';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  const timeEl = document.createElement('div');
  timeEl.className = 'bubble-time';
  timeEl.textContent = nowTime();

  const col = document.createElement('div');
  col.style.display = 'flex'; col.style.flexDirection = 'column';
  col.appendChild(bubble);
  col.appendChild(timeEl);

  const av = document.createElement('div');
  av.className = 'bubble-avatar ghost';

  row.appendChild(col);
  row.appendChild(av);
  appendToMessages(row);
}

function addHubDivider(label) {
  const div = document.createElement('div');
  div.className = 'hub-divider';
  div.style.color = primaryColor;
  div.innerHTML = `<span style="border-color:${primaryColor};background:rgba(${hexToRgb(primaryColor)},0.10)">${label}</span>`;
  appendToMessages(div);
}

function appendToMessages(el) {
  const c = document.getElementById('messages');
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════════
function startTimer(secs, expireMsg) {
  // inject a small countdown pill above input
  const c = document.getElementById('messages');
  const pill = document.createElement('div');
  pill.id = 'timer-pill';
  pill.style.cssText = `align-self:center;font-size:11px;padding:3px 12px;border-radius:20px;background:rgba(232,75,110,0.10);color:#e84b6e;border:1px solid rgba(232,75,110,0.25);transition:all .3s`;
  pill.textContent = `⏱ ${secs}s`;
  c.appendChild(pill); c.scrollTop = c.scrollHeight;
  let rem = secs;
  timerInterval = setInterval(() => {
    rem--;
    if (pill.isConnected) pill.textContent = `⏱ ${rem}s`;
    if (rem <= 0) clearInterval(timerInterval);
  }, 1000);
  timerTimeout = setTimeout(() => {
    clearInterval(timerInterval);
    if (pill.isConnected) pill.remove();
    disableInput();
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    if (expireMsg) addBotMsg(expireMsg);
    document.getElementById('restart-bar').classList.add('show');
  }, secs * 1000);
}

function clearTimer() {
  if (timerTimeout)  { clearTimeout(timerTimeout);  timerTimeout = null; }
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  document.getElementById('timer-pill')?.remove();
}

// ═══════════════════════════════════════════════════════════
// AI
// ═══════════════════════════════════════════════════════════
async function callAI(prompt) {
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    return data.content?.[0]?.text || '(sem resposta)';
  } catch(err) { return '(erro ao chamar IA: ' + err.message + ')'; }
}

// ═══════════════════════════════════════════════════════════
// CONDITION EVAL
// ═══════════════════════════════════════════════════════════
function evalCondRule(rule, vars) {
  const a = vars[rule.varA] !== undefined ? String(vars[rule.varA]) : '';
  const b = rule.compareType === 'variable'
    ? (vars[rule.varB] !== undefined ? String(vars[rule.varB]) : '')
    : (rule.valB || '');
  const op = rule.op;
  if (op === 'eq')          return a === b;
  if (op === 'neq')         return a !== b;
  if (op === 'contains')    return a.includes(b);
  if (op === 'notContains') return !a.includes(b);
  if (op === 'startsWith')  return a.startsWith(b);
  if (op === 'endsWith')    return a.endsWith(b);
  if (op === 'empty')       return a.trim() === '';
  if (op === 'notEmpty')    return a.trim() !== '';
  if (op === 'gt')          return parseFloat(a) > parseFloat(b);
  if (op === 'gte')         return parseFloat(a) >= parseFloat(b);
  if (op === 'lt')          return parseFloat(a) < parseFloat(b);
  if (op === 'lte')         return parseFloat(a) <= parseFloat(b);
  if (op === 'numEq')       return parseFloat(a) === parseFloat(b);
  if (op === 'numNeq')      return parseFloat(a) !== parseFloat(b);
  return false;
}

function getNestedValue(obj, path) {
  return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), obj);
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function interpolate(text) {
  if (!text) return '';
  return text.replace(/\{\{(\w+)\}\}/g, (_, k) => chatVars[k] !== undefined ? chatVars[k] : `{{${k}}}`);
}

function nowTime() {
  return new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

function hexToRgb(hex) {
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)].join(',');
}
