<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de QR Code — Eletrofrio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #18ade8;
    --primary-dark: #1090c4;
    --bg: #0f1117;
    --bg2: #181c27;
    --bg3: #1e2333;
    --border: rgba(255,255,255,0.08);
    --text: #f0f2f5;
    --text2: #8b93a8;
    --radius: 12px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px 60px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
    width: 100%;
    max-width: 560px;
  }
  .logo {
    width: 42px; height: 42px;
    background: var(--primary);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header-text h1 {
    font-size: 18px; font-weight: 600; color: var(--text);
  }
  .header-text p {
    font-size: 13px; color: var(--text2); margin-top: 2px;
  }

  /* Card */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 560px;
  }

  /* Form */
  .field { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  input[type="text"] {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus { border-color: var(--primary); }
  input[type="text"]::placeholder { color: var(--text2); }

  .url-preview {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text2);
    font-family: monospace;
    word-break: break-all;
    min-height: 38px;
    line-height: 1.5;
    margin-top: 4px;
  }
  .url-preview span { color: var(--primary); }

  .btn-gerar {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    margin-top: 6px;
    transition: background .15s, opacity .15s;
  }
  .btn-gerar:hover { background: var(--primary-dark); }
  .btn-gerar:disabled { opacity: .5; cursor: default; }

  /* Result wrapper (dark UI around the printable label) */
  .result {
    display: none;
    margin-top: 28px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  .result.visible { display: block; }

  /* Etiqueta (printable label) */
  .etiqueta {
    background: #ffffff;
    color: #0f1117;
    border-radius: 14px;
    padding: 26px 22px 22px;
    width: 280px;
    margin: 0 auto;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }
  .etiqueta-titulo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--primary-dark);
    margin-bottom: 18px;
  }
  .etiqueta-nome {
    font-size: 15px;
    font-weight: 600;
    color: #0f1117;
    margin-bottom: 2px;
  }
  .etiqueta-pedido {
    font-size: 12px;
    color: #5a6272;
    font-family: monospace;
    margin-bottom: 16px;
  }

  #qr-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
  }
  #qr-container canvas, #qr-container img {
    display: block;
    border-radius: 8px;
  }

  .etiqueta-marca {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .08em;
    color: #0f1117;
    margin-top: 4px;
  }
  .etiqueta-marca span { color: #0f1117; }

  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 24px;
  }

  .btn-sec {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    font-family: var(--font);
    cursor: pointer;
    transition: border-color .15s;
  }
  .btn-sec:hover { border-color: var(--primary); color: var(--primary); }

  .btn-print {
    background: var(--primary);
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    font-family: var(--font);
    cursor: pointer;
    transition: background .15s;
  }
  .btn-print:hover { background: var(--primary-dark); }

  /* Print styles */
  @media print {
    body { background: #fff; padding: 0; justify-content: center; }
    .header, .card, .btn-row { display: none !important; }
    .result { display: block !important; border: none; background: #fff; padding: 0; }
    .etiqueta { box-shadow: none; width: 8cm; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">❄️</div>
  <div class="header-text">
    <h1>Gerador de QR Code</h1>
    <p>Eletrofrio — Atendimento ao cliente</p>
  </div>
</div>

<div class="card">
  <div class="field">
    <label>Número do pedido</label>
    <input type="text" id="pedido" placeholder="Ex: 11805424" oninput="atualizarPreview()">
  </div>
  <div class="field">
    <label>Nome da loja / cliente</label>
    <input type="text" id="nome" placeholder="Ex: Supermercado Silva" oninput="atualizarPreview()">
  </div>
  <div class="field">
    <label>URL que será gerada</label>
    <div class="url-preview" id="url-preview">Preencha os campos acima...</div>
  </div>
  <button class="btn-gerar" id="btn-gerar" onclick="gerarQR()" disabled>Gerar QR Code</button>
</div>

<div class="result" id="result">
  <div class="etiqueta" id="etiqueta">
    <div class="etiqueta-titulo">Assistência técnica</div>
    <div class="etiqueta-nome" id="res-nome"></div>
    <div class="etiqueta-pedido" id="res-pedido"></div>
    <div id="qr-container"></div>
    <div class="etiqueta-marca">ELETRO<span>FRIO</span></div>
  </div>
  <div class="btn-row">
    <button class="btn-sec" onclick="copiarURL()">📋 Copiar URL</button>
    <button class="btn-sec" onclick="novoQR()">↩ Novo QR</button>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir</button>
  </div>
</div>

<script>
  // URL do chatbot — detectada automaticamente a partir do domínio onde este arquivo está hospedado
  const BASE_URL = window.location.origin + '/interface.html';

  let urlAtual = '';

  function atualizarPreview() {
    const pedido = document.getElementById('pedido').value.trim();
    const nome   = document.getElementById('nome').value.trim();
    const btn    = document.getElementById('btn-gerar');
    const preview = document.getElementById('url-preview');

    if (!pedido && !nome) {
      preview.innerHTML = 'Preencha os campos acima...';
      btn.disabled = true;
      urlAtual = '';
      return;
    }

    const params = new URLSearchParams();
    if (pedido) params.set('pedido', pedido);
    if (nome)   params.set('nome', nome);

    urlAtual = BASE_URL + (BASE_URL.includes('?') ? '&' : '?') + params.toString();

    const [urlBase, urlQuery] = urlAtual.split('?');
    preview.innerHTML = urlBase + '?<span>' + urlQuery + '</span>';

    btn.disabled = !(pedido || nome);
  }

  // Desenha o "selo" de atendimento (fone de ouvido) no centro do QR.
  // Usa apenas arc/ellipse/quadraticCurveTo (sem roundRect) para compatibilidade ampla.
  function desenharIconeCentral(ctx, cx, cy, raioBase) {
    const r = raioBase;

    // Fundo branco para "furar" o QR no centro
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = Math.max(2, r * 0.09);
    ctx.strokeStyle = '#18ade8';
    ctx.stroke();

    ctx.fillStyle = '#18ade8';
    ctx.strokeStyle = '#18ade8';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const s = r * 0.6;

    // Arco do headset
    ctx.lineWidth = s * 0.3;
    ctx.beginPath();
    ctx.arc(cx, cy - s * 0.1, s * 0.95, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();

    // Fone esquerdo
    ctx.beginPath();
    ctx.ellipse(cx - s * 0.95, cy + s * 0.35, s * 0.28, s * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();

    // Fone direito
    ctx.beginPath();
    ctx.ellipse(cx + s * 0.95, cy + s * 0.35, s * 0.28, s * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();

    // Haste do microfone
    ctx.lineWidth = s * 0.16;
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.95, cy + s * 0.6);
    ctx.quadraticCurveTo(cx + s * 0.7, cy + s * 1.05, cx + s * 0.1, cy + s * 0.9);
    ctx.stroke();

    // Ponta do microfone
    ctx.beginPath();
    ctx.arc(cx + s * 0.05, cy + s * 0.9, s * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }

  // QRCode.js gera um <canvas> ou, em alguns navegadores/versões, troca para <img>.
  // Para garantir que o ícone apareça em qualquer caso, o QR é redesenhado num canvas
  // próprio (via drawImage) e o ícone é pintado por cima dele.
  function aplicarSeloNoQR(container, tamanho) {
    const origem = container.querySelector('canvas') || container.querySelector('img');
    if (!origem) return;

    const finalizar = () => {
      const canvasFinal = document.createElement('canvas');
      canvasFinal.width = tamanho;
      canvasFinal.height = tamanho;
      const ctx = canvasFinal.getContext('2d');
      ctx.drawImage(origem, 0, 0, tamanho, tamanho);
      desenharIconeCentral(ctx, tamanho / 2, tamanho / 2, tamanho * 0.17);
      container.innerHTML = '';
      container.appendChild(canvasFinal);
    };

    if (origem.tagName === 'IMG' && !origem.complete) {
      origem.onload = finalizar;
    } else {
      finalizar();
    }
  }

  function gerarQR() {
    if (!urlAtual) return;

    const pedido = document.getElementById('pedido').value.trim();
    const nome   = document.getElementById('nome').value.trim();

    document.getElementById('res-nome').textContent   = nome   || '—';
    document.getElementById('res-pedido').textContent = pedido ? ('Pedido: ' + pedido) : '';

    const container = document.getElementById('qr-container');
    container.innerHTML = '';

    const TAMANHO_QR = 220;

    new QRCode(container, {
      text:         urlAtual,
      width:        TAMANHO_QR,
      height:       TAMANHO_QR,
      colorDark:    '#0f1117',
      colorLight:   '#ffffff',
      correctLevel: QRCode.CorrectLevel.H,
    });

    setTimeout(() => aplicarSeloNoQR(container, TAMANHO_QR), 50);

    document.getElementById('result').classList.add('visible');
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copiarURL() {
    if (!urlAtual) return;
    navigator.clipboard.writeText(urlAtual).then(() => {
      const btn = document.querySelector('.btn-sec');
      const original = btn.textContent;
      btn.textContent = '✓ Copiado!';
      setTimeout(() => btn.textContent = original, 2000);
    });
  }

  function novoQR() {
    document.getElementById('pedido').value = '';
    document.getElementById('nome').value   = '';
    document.getElementById('result').classList.remove('visible');
    document.getElementById('url-preview').innerHTML = 'Preencha os campos acima...';
    document.getElementById('btn-gerar').disabled = true;
    document.getElementById('qr-container').innerHTML = '';
    urlAtual = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  atualizarPreview();
</script>
</body>
</html>
