<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de QR Code — Eletrofrio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #18ade8;
    --primary-dark: #1090c4;
    --bg: #ffffff;
    --bg2: #f5f7fa;
    --bg3: #eef1f5;
    --border: rgba(3,3,32,0.08);
    --text: #030320;
    --text2: #6b6d7c;
    --radius: 12px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px 60px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
    width: 100%;
    max-width: 560px;
  }
  .logo {
    width: 42px; height: 42px;
    background: var(--primary);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header-text h1 {
    font-size: 18px; font-weight: 600; color: var(--text);
  }
  .header-text p {
    font-size: 13px; color: var(--text2); margin-top: 2px;
  }

  /* Card */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 560px;
  }

  /* Form */
  .field { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  input[type="text"] {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus { border-color: var(--primary); }
  input[type="text"]::placeholder { color: var(--text2); }

  .url-preview {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text2);
    font-family: monospace;
    word-break: break-all;
    min-height: 38px;
    line-height: 1.5;
    margin-top: 4px;
  }
  .url-preview span { color: var(--primary); }

  .btn-gerar {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    margin-top: 6px;
    transition: background .15s, opacity .15s;
  }
  .btn-gerar:hover { background: var(--primary-dark); }
  .btn-gerar:disabled { opacity: .5; cursor: default; }

  /* Result wrapper (dark UI around the printable label) */
  .result {
    display: none;
    margin-top: 28px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  .result.visible { display: block; }

  /* Etiqueta (printable label) */
  .etiqueta {
    background: #ffffff;
    color: #0f1117;
    border-radius: 14px;
    padding: 26px 22px 22px;
    width: 280px;
    margin: 0 auto;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }
  .etiqueta-titulo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--primary-dark);
    margin-bottom: 18px;
  }
  .etiqueta-nome {
    font-size: 15px;
    font-weight: 600;
    color: #0f1117;
    margin-bottom: 2px;
  }
  .etiqueta-pedido {
    font-size: 12px;
    color: #5a6272;
    font-family: monospace;
    margin-bottom: 16px;
  }

  #qr-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
  }
  #qr-container canvas, #qr-container img {
    display: block;
    border-radius: 8px;
  }

  .etiqueta-marca {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .08em;
    color: #0f1117;
    margin-top: 4px;
  }
  .etiqueta-marca span { color: #0f1117; }

  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 24px;
  }

  .btn-sec {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    font-family: var(--font);
    cursor: pointer;
    transition: border-color .15s;
  }
  .btn-sec:hover { border-color: var(--primary); color: var(--primary); }

  .btn-print {
    background: var(--primary);
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    font-family: var(--font);
    cursor: pointer;
    transition: background .15s;
  }
  .btn-print:hover { background: var(--primary-dark); }

  /* Print styles */
  @media print {
    body { background: #fff; margin: 0; padding: 0; display: block; }
    .header, .card, .btn-row { display: none !important; }
    .result {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: #fff;
    }
    .etiqueta {
      box-shadow: none;
      width: 8cm;
      border: 2px solid var(--primary-dark);
    }
  }
</style>
<style id="tamanho-pagina-impressao"></style>
</head>
<body>

<div class="header">
  <div class="logo">
    <svg viewBox="0 0 100 100" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
      <!-- olho superior-esquerdo -->
      <rect x="6" y="6" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="7"/>
      <rect x="16" y="16" width="10" height="10" rx="2" fill="#ffffff"/>
      <!-- olho superior-direito -->
      <rect x="64" y="6" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="7"/>
      <rect x="74" y="16" width="10" height="10" rx="2" fill="#ffffff"/>
      <!-- olho inferior-esquerdo -->
      <rect x="6" y="64" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="7"/>
      <rect x="16" y="74" width="10" height="10" rx="2" fill="#ffffff"/>
      <!-- módulos soltos -->
      <rect x="46" y="6"  width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="46" y="20" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="60" y="46" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="74" y="46" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="88" y="46" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="46" y="46" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="46" y="60" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="46" y="74" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="46" y="88" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="60" y="74" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="74" y="88" width="9" height="9" rx="2" fill="#ffffff"/>
      <rect x="88" y="74" width="9" height="9" rx="2" fill="#ffffff"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>Gerador de QR Code</h1>
    <p>Eletrofrio — Atendimento ao cliente</p>
  </div>
</div>

<div class="card">
  <div class="field">
    <label>Número do pedido</label>
    <input type="text" id="pedido" placeholder="Ex: 11805424" oninput="atualizarPreview()">
  </div>
  <div class="field">
    <label>Nome da loja / cliente</label>
    <input type="text" id="nome" placeholder="Ex: Supermercado Silva" oninput="atualizarPreview()">
  </div>
  <div class="field" style="display:none;">
    <label>URL que será gerada</label>
    <div class="url-preview" id="url-preview">Preencha os campos acima...</div>
  </div>
  <button class="btn-gerar" id="btn-gerar" onclick="gerarQR()" disabled>Gerar QR Code</button>
</div>

<div class="result" id="result">
  <div class="etiqueta" id="etiqueta">
    <div class="etiqueta-titulo">Assistência técnica</div>
    <div class="etiqueta-nome" id="res-nome"></div>
    <div class="etiqueta-pedido" id="res-pedido"></div>
    <div id="qr-container"></div>
    <div class="etiqueta-marca">ELETRO<span>FRIO</span></div>
  </div>
  <div class="btn-row">
    <button class="btn-sec" onclick="copiarURL()">📋 Copiar URL</button>
    <button class="btn-sec" onclick="novoQR()">↩ Novo QR</button>
    <button class="btn-print" onclick="ajustarPaginaImpressao(); window.print()">🖨️ Imprimir</button>
  </div>
</div>

<script>
  // URL do chatbot — detectada automaticamente a partir do domínio onde este arquivo está hospedado
  const BASE_URL = window.location.origin + '/interface.html';

  let urlAtual = '';

  function atualizarPreview() {
    const pedido = document.getElementById('pedido').value.trim();
    const nome   = document.getElementById('nome').value.trim();
    const btn    = document.getElementById('btn-gerar');
    const preview = document.getElementById('url-preview');

    if (!pedido && !nome) {
      preview.innerHTML = 'Preencha os campos acima...';
      btn.disabled = true;
      urlAtual = '';
      return;
    }

    const params = new URLSearchParams();
    if (pedido) params.set('pedido', pedido);
    if (nome)   params.set('nome', nome);

    urlAtual = BASE_URL + (BASE_URL.includes('?') ? '&' : '?') + params.toString();

    const [urlBase, urlQuery] = urlAtual.split('?');
    preview.innerHTML = urlBase + '?<span>' + urlQuery + '</span>';

    btn.disabled = !(pedido || nome);
  }

  // Caminho de retângulo arredondado usando arcTo (suporte universal, sem depender de roundRect)
  function caminhoRetArredondado(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Extrai a matriz de módulos (claro/escuro) do QR usando o QRCode.js internamente,
  // sem depender do desenho padrão dele (que só faz quadrados sólidos).
  function obterMatrizQR(texto) {
    const tmp = document.createElement('div');
    tmp.style.position = 'absolute';
    tmp.style.left = '-9999px';
    document.body.appendChild(tmp);
    const qr = new QRCode(tmp, { text: texto, correctLevel: QRCode.CorrectLevel.H });
    const modelo = qr._oQRCode;
    const n = modelo.getModuleCount();
    const matriz = [];
    for (let r = 0; r < n; r++) {
      const linha = [];
      for (let c = 0; c < n; c++) linha.push(modelo.isDark(r, c));
      matriz.push(linha);
    }
    document.body.removeChild(tmp);
    return matriz;
  }

  // Desenha o selo de atendimento (fone de ouvido) dentro de uma caixa arredondada central
  function desenharSeloAtendimento(ctx, cx, cy, boxSize, cor) {
    const x = cx - boxSize / 2;
    const y = cy - boxSize / 2;
    const raio = boxSize * 0.24;

    // Caixa branca de fundo
    ctx.fillStyle = '#ffffff';
    caminhoRetArredondado(ctx, x, y, boxSize, boxSize, raio);
    ctx.fill();

    // Borda colorida
    const borda = boxSize * 0.07;
    ctx.lineWidth = borda;
    ctx.strokeStyle = cor;
    caminhoRetArredondado(ctx, x + borda / 2, y + borda / 2, boxSize - borda, boxSize - borda, raio);
    ctx.stroke();

    // Ícone do fone de ouvido, centralizado na caixa
    const s = boxSize * 0.19;
    ctx.fillStyle = cor;
    ctx.strokeStyle = cor;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.lineWidth = s * 0.26;
    ctx.beginPath();
    ctx.arc(cx, cy - s * 0.1, s * 0.95, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(cx - s * 0.95, cy + s * 0.35, s * 0.26, s * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(cx + s * 0.95, cy + s * 0.35, s * 0.26, s * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineWidth = s * 0.15;
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.95, cy + s * 0.6);
    ctx.quadraticCurveTo(cx + s * 0.7, cy + s * 1.05, cx + s * 0.1, cy + s * 0.9);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx + s * 0.05, cy + s * 0.9, s * 0.14, 0, Math.PI * 2);
    ctx.fill();
  }

  // Desenha o QR no estilo "pontilhado" (dots + olhos arredondados + selo central),
  // no tom azul da Eletrofrio.
  function desenharQREstilizado(container, texto, tamanhoCanvas) {
    const matriz = obterMatrizQR(texto);
    const n = matriz.length;

    const canvas = document.createElement('canvas');
    canvas.width = tamanhoCanvas;
    canvas.height = tamanhoCanvas;
    const ctx = canvas.getContext('2d');

    const zonaSilencio = 1.5; // margem em módulos
    const cell = tamanhoCanvas / (n + zonaSilencio * 2);
    const offset = zonaSilencio * cell;

    // Fundo branco
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, tamanhoCanvas, tamanhoCanvas);

    // Gradiente azul Eletrofrio (mesma ideia do exemplo, em tom de marca)
    const gradiente = ctx.createLinearGradient(0, 0, tamanhoCanvas, tamanhoCanvas);
    gradiente.addColorStop(0, '#18ade8');
    gradiente.addColorStop(0.55, '#1090c4');
    gradiente.addColorStop(1, '#0b3f66');

    const ehOlho = (r, c) =>
      (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);

    // Pontos (módulos de dado, fora das áreas dos 3 "olhos")
    ctx.fillStyle = gradiente;
    const raioPonto = cell * 0.4;
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (ehOlho(r, c)) continue;
        if (!matriz[r][c]) continue;
        const cx = offset + c * cell + cell / 2;
        const cy = offset + r * cell + cell / 2;
        ctx.beginPath();
        ctx.arc(cx, cy, raioPonto, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Olhos (posições de detecção) com estilo arredondado
    const posicoesOlhos = [[0, 0], [0, n - 7], [n - 7, 0]];
    posicoesOlhos.forEach(([r0, c0]) => {
      const ex = offset + c0 * cell;
      const ey = offset + r0 * cell;
      const tamOlho = cell * 7;
      const borda = cell * 1.05;
      const raioCanto = cell * 2;

      ctx.lineWidth = borda;
      ctx.strokeStyle = gradiente;
      caminhoRetArredondado(ctx, ex + borda / 2, ey + borda / 2, tamOlho - borda, tamOlho - borda, raioCanto);
      ctx.stroke();

      const tamMiolo = cell * 3;
      ctx.fillStyle = gradiente;
      caminhoRetArredondado(ctx, ex + cell * 2, ey + cell * 2, tamMiolo, tamMiolo, cell * 0.9);
      ctx.fill();
    });

    // Selo de atendimento no centro
    const tamanhoSelo = tamanhoCanvas * 0.24;
    desenharSeloAtendimento(ctx, tamanhoCanvas / 2, tamanhoCanvas / 2, tamanhoSelo, '#1090c4');

    container.innerHTML = '';
    container.appendChild(canvas);
  }

  function gerarQR() {
    if (!urlAtual) return;

    const pedido = document.getElementById('pedido').value.trim();
    const nome   = document.getElementById('nome').value.trim();

    document.getElementById('res-nome').textContent   = nome   || '—';
    document.getElementById('res-pedido').textContent = pedido ? ('Pedido: ' + pedido) : '';

    const container = document.getElementById('qr-container');
    container.innerHTML = '';

    const TAMANHO_QR = 240;

    try {
      desenharQREstilizado(container, urlAtual, TAMANHO_QR);
    } catch (e) {
      // Fallback de segurança: QR padrão caso a extração da matriz falhe
      console.error('Falha ao estilizar o QR, usando modelo padrão:', e);
      new QRCode(container, {
        text: urlAtual,
        width: TAMANHO_QR,
        height: TAMANHO_QR,
        colorDark: '#0f1117',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H,
      });
    }

    document.getElementById('result').classList.add('visible');
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copiarURL() {
    if (!urlAtual) return;
    navigator.clipboard.writeText(urlAtual).then(() => {
      const btn = document.querySelector('.btn-sec');
      const original = btn.textContent;
      btn.textContent = '✓ Copiado!';
      setTimeout(() => btn.textContent = original, 2000);
    });
  }

  function novoQR() {
    document.getElementById('pedido').value = '';
    document.getElementById('nome').value   = '';
    document.getElementById('result').classList.remove('visible');
    document.getElementById('url-preview').innerHTML = 'Preencha os campos acima...';
    document.getElementById('btn-gerar').disabled = true;
    document.getElementById('qr-container').innerHTML = '';
    urlAtual = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  atualizarPreview();

  // Ajusta o tamanho da página de impressão para o tamanho real da etiqueta,
  // assim o resultado impresso é só a etiqueta (com a moldura), sem sobra de folha A4.
  function ajustarPaginaImpressao() {
    const etiqueta = document.getElementById('etiqueta');
    const estiloPagina = document.getElementById('tamanho-pagina-impressao');
    if (!etiqueta || !estiloPagina) return;

    const rect = etiqueta.getBoundingClientRect();
    const pxParaMm = 25.4 / 96;
    const largura = Math.ceil(rect.width * pxParaMm);
    const altura  = Math.ceil(rect.height * pxParaMm);

    estiloPagina.textContent = `@page { size: ${largura}mm ${altura}mm; margin: 0; }`;
  }

  window.addEventListener('beforeprint', ajustarPaginaImpressao);
</script>
</body>
</html>
